
name: Build executable

on:
  workflow_dispatch:
    inputs:
      enable_update_notifications:
        description: Include GitHub release checks when Wand starts
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build and test WandEnhancer
        shell: pwsh
        env:
          ENABLE_UPDATE_NOTIFICATIONS: ${{ inputs.enable_update_notifications }}
        run: |
          if ($env:ENABLE_UPDATE_NOTIFICATIONS -eq 'true') {
            & ./build.ps1 -Configuration Release -EnableUpdateNotifications
          } else {
            & ./build.ps1 -Configuration Release
          }

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-unsigned
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error

      - name: Verify optional update notifications build
        if: ${{ inputs.enable_update_notifications != true }}
        shell: pwsh
        run: '& ./build.ps1 -Configuration Release -EnableUpdateNotifications'
